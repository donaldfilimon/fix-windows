name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    # Self-hosted while the GitHub account billing lock blocks hosted runners.
    runs-on: [self-hosted, linux, ARM64, fix-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Fmt, lint, test, packager stubs
        run: |
          export PATH="/usr/local/cargo/bin:$PATH"
          export RUSTUP_HOME=/usr/local/rustup
          export CARGO_HOME=/usr/local/cargo
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          sh tests/package-linux.sh
      - name: Package release kit
        run: |
          export PATH="/usr/local/cargo/bin:$PATH"
          export RUSTUP_HOME=/usr/local/rustup
          export CARGO_HOME=/usr/local/cargo
          sh scripts/package-linux.sh target/bundle
      - name: Prepare scanner and trusted test signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav ntfs-3g
          sudo mkdir -p /mnt/fixture-db
          sudo umount /mnt/fixture-db 2>/dev/null || true
          sudo mount -t tmpfs -o size=512M,mode=0755 tmpfs /mnt/fixture-db
          test -d /clam-db
          sudo cp /clam-db/*.cvd /mnt/fixture-db/
          sudo chmod 644 /mnt/fixture-db/*.cvd
      - name: Verify staged bytes and run fixtures with networking isolated
        run: |
          (cd target/bundle && sha256sum --check --strict SHA256SUMS)
          sudo unshare --net env CLAM_TEST_DB=/mnt/fixture-db sh tests/linux-fixture.sh target/bundle/fix-windows
          sudo unshare --net sh tests/ntfs-image.sh target/bundle/fix-windows

name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    # Self-hosted while the GitHub account billing lock blocks hosted runners.
    runs-on: [self-hosted, linux, ARM64, fix-windows]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: |
          rustup component add rustfmt clippy
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          sh tests/package-linux.sh

  package-and-audit:
    needs: rust
    runs-on: [self-hosted, linux, ARM64, fix-windows]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: sh scripts/package-linux.sh target/bundle
      - name: Prepare scanner and trusted test signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav ntfs-3g
          sudo mkdir -p /mnt/fixture-db
          sudo mount -t tmpfs -o size=512M,mode=0755 tmpfs /mnt/fixture-db
          if [ -d /clam-db ] && ls /clam-db/*.cvd >/dev/null 2>&1; then
            sudo cp /clam-db/*.cvd /mnt/fixture-db/
            sudo chmod 644 /mnt/fixture-db/*.cvd
          else
            mkdir -p "$RUNNER_TEMP/clam-db"
            sudo mount -t tmpfs -o size=512M,mode=0755 tmpfs "$RUNNER_TEMP/clam-db"
            docker run --rm --entrypoint /bin/sh -v "$RUNNER_TEMP/clam-db:/db" clamav/clamav:1.4 -ec 'cp /var/lib/clamav/*.cvd /db; chmod 644 /db/*.cvd'
            sudo mount --bind "$RUNNER_TEMP/clam-db" /mnt/fixture-db
          fi
      - name: Verify staged bytes and run fixtures with networking isolated
        run: |
          (cd target/bundle && sha256sum --check --strict SHA256SUMS)
          sudo unshare --net env CLAM_TEST_DB=/mnt/fixture-db sh tests/linux-fixture.sh target/bundle/fix-windows
          sudo unshare --net sh tests/ntfs-image.sh target/bundle/fix-windows
